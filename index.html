<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reiseblog</title>
  <link rel="stylesheet" href="./styles/reset.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/variables.css" />
  <link rel="stylesheet" href="./styles/font.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <nav>
      <img src="./assets/icons/logo.svg" alt="Weltkugel mit Flugzeug" />
      <ul>
        <li>
          <a href="">Highlights</a>
        </li>
        <li>
          <a href="">FAQ</a>
        </li>
        <li>
          <a href="">Contact </a>
        </li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="landing-section">
      <!-- <img class="landing-animation" src="./assets/img/landing-animation-2.svg" alt="" /> -->
      <div class="rotation-logo">
        <div class="rotation-container">
          <img class="rotation" src="./assets/img/TürkischCircle-160x160.svg"
            alt="Ein grüner Kreis, mit Türkischen symbol in der mitte der sich im kreis dreht." />
          <img class="no-rotation" src="./assets/img/Flag_orb_Turkey 1.svg" alt="" />
        </div>
      </div>
    </section>
    <!-- Highlights -->
    <section>
      <section>
        <div class="main-sections">
          <img src="./assets/icons/rocket_launch.svg" alt="kleines symbol einer rackete" />
          <h2>Highlights</h2>
        </div>
        <article class="galerie-center">
          <div class="galerie-container">
            <div class="galerie-buttons">
              <input type="radio" name="slider" id="one" checked />
              <input type="radio" name="slider" id="two" />
              <input type="radio" name="slider" id="three" />
              <input type="radio" name="slider" id="four" />
            </div>

            <div class="galerie-pictures">
              <div class="slider-element element-one"><img src="./assets/img/header photo.png" alt="" /></div>
              <div class="slider-element element-two"><img src="./assets/img/header photo-2.png" alt="" /></div>
              <div class="slider-element element-three"><img src="./assets/img/header photo-3.png" alt="" /></div>
              <div class="slider-element element-four"><img src="./assets/img/header photo-4.png" alt="" /></div>
            </div>
          </div>
        </article>
        <!-- bilder box -->
      </section>
    </section>
    <!-- contact form  -->
    <section class="section-Contact">
      <div class="main-sections">
        <img src="./assets/icons/person_pin.svg" alt="" />
        <h2>Contact form</h2>
      </div>

      <form class="contact">
        <p>
          Have a question or an idea to collaborate? <br>
          Get in touch—I’d love to hear from you and explore how we can work together.
        </p>
        <div class="top">
          <div>
            <label for="">What's your name?</label>
            <input class="contact-input" type="text" name="" id="">
          </div>
          <div>
            <label for="">What's your email?</label>
            <input class="contact-input" type="email" name="" id="">
          </div>
        </div>

        <div class="form-box-bottom">
          <label for="">How can I help?</label>
          <input class="contact-input" type="text" name="" id="">
        </div>

        <div class="contact-policy">
          <div>
            <input class="contact-checkbox" type="checkbox" name="police" id="">
            <label for="police">I've read the
              <a class="inline-link" href="">privacy policy</a>
              and agree to the processing of my data as outlined.
            </label>
          </div>
          <input class="button-send" type="button" value="Send">

        </div>



      </form>

    </section>
  </main>

  <!-- footer  -->
  <footer>
    <section class="footer-content">
      <a href="">Imprint</a>
      <a href="">Cookie Preferences</a>
      <p>© Travel Blog 2026</p>
    </section>

    <section class="footer-social">
      <a href=""><img src="./assets/icons/Tiktok_icon 1.svg" alt="" /></a>
      <a href=""><img src="./assets/icons/youtube.svg" alt="" /></a>
      <a href=""><img src="./assets/icons/facebook.svg" alt="" /></a>
      <a href=""><img src="./assets/icons/Instagram_logo_2016 1.svg" alt="" /></a>
    </section>
  </footer>
</body>

</html>
